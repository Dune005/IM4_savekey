<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren – VR-Igloo</title>
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="manifest" href="/assets/site.webmanifest">

    <!-- Typography: Open Sans (VR-Igloo Design) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="js/global-auth.js"></script>
  </head>
  <body class="login-body modern">
    <div class="login-wrapper">
      <a href="index.html" class="back-link-modern">
        <i class="fas fa-arrow-left"></i> Zurück
      </a>
      
      <div class="login-container modern register-container">
        <div class="login-header">
          <span class="login-badge">VR-Igloo</span>
          <h1>Registriere dich</h1>
          <p class="login-subtitle">Erstelle dein Konto für den Zugang zur Schlüsselbox.</p>
        </div>
        
        <!-- Live-Region für Statusmeldungen -->
        <div id="form-messages" aria-live="polite" aria-atomic="true" class="sr-only"></div>
        
        <form id="registerForm" novalidate>
          <div class="form-group">
            <label for="vorname">Vorname</label>
            <input type="text" id="vorname" name="vorname" placeholder="Dein Vorname" required aria-required="true" aria-describedby="vorname-error" />
            <div id="vorname-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="nachname">Nachname</label>
            <input type="text" id="nachname" name="nachname" placeholder="Dein Nachname" required aria-required="true" aria-describedby="nachname-error" />
            <div id="nachname-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="benutzername">Benutzername</label>
            <input type="text" id="benutzername" name="benutzername" placeholder="Dein Benutzername" required aria-required="true" aria-describedby="benutzername-error" />
            <div id="benutzername-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="mail">E-Mail</label>
            <input type="email" id="mail" name="mail" placeholder="name@example.com" required aria-required="true" aria-describedby="mail-error" />
            <div id="mail-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" placeholder="Dein Passwort" required aria-required="true" aria-describedby="password-error" />
            <div id="password-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="phone">Telefon (optional)</label>
            <input type="tel" id="phone" name="phone" placeholder="Deine Nummer" aria-describedby="phone-error" />
            <div id="phone-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <div class="form-group">
            <label for="seriennummer">Seriennummer deiner Schlüsselbox</label>
            <input type="text" id="seriennummer" name="seriennummer" placeholder="z. B. 550" required aria-required="true" aria-describedby="seriennummer-error" />
            <div id="seriennummer-error" class="error-message" aria-live="polite" style="display: none;"></div>
          </div>
          <button type="submit" class="button-primary">Konto erstellen</button>
        </form>
        
        <p class="register-link">Bereits ein Konto? <a href="login.html">Zum Login</a></p>
      </div>
    </div>
    <script src="js/register.js"></script>
  </body>
</html>
